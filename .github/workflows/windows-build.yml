name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.13 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'

      - name: Install NSIS 3.11
        shell: pwsh
        run: |
          choco install nsis --version=3.11 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "NSIS installation failed" }

      - name: Test and build installer
        shell: pwsh
        run: |
          & .\scripts\build_windows.ps1 -PythonExe (Get-Command python).Source

      - name: Prepare the ephemeral Windows capture display
        shell: pwsh
        run: |
          & .\scripts\prepare_capture_display.ps1

      - name: Capture and verify Windows desktop layouts
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist\NhacViecAnhHa\NhacViecAnhHa.exe'
          $output = Join-Path $PWD 'dist\ui-preview'
          $process = Start-Process -FilePath $exe -ArgumentList @('--capture-ui', ('"' + $output + '"')) -PassThru
          if (-not $process.WaitForExit(180000)) {
            $process.Kill()
            throw 'Frozen application interface capture exceeded three minutes.'
          }
          $process.Refresh()
          $reportPath = Join-Path $output 'layout-check.json'
          if (-not (Test-Path -LiteralPath $reportPath)) { throw 'Frozen application did not write a layout report.' }
          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          if ($process.ExitCode -ne 0 -or $report.passed -ne $true) {
            $message = ([string]$report.error).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Windows layout verification::$message"
            throw 'Windows desktop layout verification failed.'
          }
          if ($report.frozen -ne $true -or $report.executable -cne 'NhacViecAnhHa.exe' -or
              $report.display_state.awareness -cne 'per-monitor-v2' -or
              $report.display_state.window_awareness -cne 'per-monitor-v2') {
            throw 'Preview verification did not exercise the DPI-aware frozen application.'
          }

      - name: Smoke-test installation and uninstallation
        shell: pwsh
        run: |
          function Write-PreflightDiagnostic {
            foreach ($kind in @('Setup', 'Uninstall')) {
              $log = Join-Path $env:TEMP "NhacViecAnhHa-$kind-last.log"
              if (Test-Path -LiteralPath $log) {
                $detail = (Get-Content -LiteralPath $log -Tail 12) -join "`n"
                if ($detail.Length -gt 3000) { $detail = $detail.Substring($detail.Length - 3000) }
                $detail = $detail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
                Write-Host "::error title=Installer preflight diagnostic::$kind $detail"
              }
            }
          }
          $setup = Join-Path $PWD 'dist\NhacViecAnhHa-Setup-2.0.4-x64.exe'
          $installDir = Join-Path $env:RUNNER_TEMP 'NhacViecAnhHaInstallSmoke'
          $sentinels = @{}
          foreach ($folderName in @('NhacViecAnhHaMoi', 'NhacViecAnhHa')) {
            $dataDir = Join-Path $env:USERPROFILE "$folderName\data"
            New-Item -ItemType Directory -Path $dataDir -Force | Out-Null
            $sentinel = Join-Path $dataDir ('installer-smoke-' + [guid]::NewGuid().ToString('N') + '.txt')
            'Preserve this user data during installer smoke test.' | Set-Content $sentinel
            $sentinels[$sentinel] = (Get-FileHash $sentinel -Algorithm SHA256).Hash
          }
          $result = Start-Process -FilePath $setup -ArgumentList "/S /D=$installDir" -Wait -PassThru
          if ($result.ExitCode -ne 0) { Write-PreflightDiagnostic; throw "Silent install failed: $($result.ExitCode)" }
          $exe = Join-Path $installDir 'NhacViecAnhHa.exe'
          if (-not (Test-Path $exe)) { throw "Installed application is missing" }
          $reportPath = Join-Path $env:RUNNER_TEMP 'installed-self-test.json'
          if (Test-Path $reportPath) { Remove-Item $reportPath }
          $check = Start-Process -FilePath $exe -ArgumentList @('--self-test', '--self-test-report', ('"' + $reportPath + '"')) -Wait -PassThru
          if ($check.ExitCode -ne 0) { throw "Installed application self-test failed" }
          if (-not (Test-Path $reportPath)) { throw "Installed application did not write its self-test report" }
          $report = Get-Content $reportPath -Raw | ConvertFrom-Json
          if ($report.passed -ne $true -or $report.gui -ne $false -or $report.version -ne '2.0.4' -or @($report.checks).Count -eq 0) {
            throw "Installed application did not pass the expected checks"
          }
          $guiReportPath = Join-Path $env:RUNNER_TEMP 'installed-gui-smoke-test.json'
          $guiCheck = Start-Process -FilePath $exe -ArgumentList @('--gui-smoke-test', '--self-test-report', ('"' + $guiReportPath + '"')) -PassThru
          if (-not $guiCheck.WaitForExit(60000)) { $guiCheck.Kill(); throw 'Installed GUI check timed out.' }
          $guiCheck.Refresh()
          if ($guiCheck.ExitCode -ne 0 -or -not (Test-Path $guiReportPath)) { throw 'Installed GUI check failed.' }
          $guiReport = Get-Content $guiReportPath -Raw | ConvertFrom-Json
          if ($guiReport.passed -ne $true -or $guiReport.gui -ne $true -or $guiReport.version -cne '2.0.4' -or
              $guiReport.display.awareness -cne 'per-monitor-v2' -or $guiReport.display.window_awareness -cne 'per-monitor-v2') {
            throw 'Installed application did not retain native PerMonitorV2 rendering.'
          }
          $uninstaller = Join-Path $installDir 'Uninstall.exe'
          $remove = Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
          if ($remove.ExitCode -ne 0) { Write-PreflightDiagnostic; throw "Uninstall failed: $($remove.ExitCode)" }
          # NSIS uninstaller can delegate to its temporary copy; wait for completion.
          $deadline = (Get-Date).AddSeconds(20)
          while ((Test-Path $exe) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 250 }
          if (Test-Path $exe) { throw "Uninstaller left the application executable" }
          foreach ($sentinel in $sentinels.Keys) {
            if (-not (Test-Path $sentinel) -or (Get-FileHash $sentinel -Algorithm SHA256).Hash -ne $sentinels[$sentinel]) {
              throw "Installer/uninstaller changed user data sentinel: $sentinel"
            }
            Remove-Item $sentinel
          }

      - name: Verify locked legacy upgrade and guarded uninstall
        shell: pwsh
        run: |
          & .\scripts\test_installer_upgrade.ps1

      - name: Upload installer and checksum
        uses: actions/upload-artifact@v4
        with:
          name: NhacViecAnhHa-Windows-x64-2.0.4
          path: |
            dist/NhacViecAnhHa-Setup-2.0.4-x64.exe
            dist/SHA256SUMS.txt
            dist/self-test.json
            dist/gui-smoke-test.json
            dist/installer-upgrade-test.json
            dist/ui-preview/
          if-no-files-found: error
          retention-days: 14
