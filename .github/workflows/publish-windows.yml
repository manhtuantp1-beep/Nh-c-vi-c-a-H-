name: Publish Windows installer

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Windows build run ID from this repository
        required: true
        type: string
      expected_sha:
        description: Full source commit SHA tested by the Windows build
        required: true
        type: string

concurrency:
  group: publish-windows-2.0.4-preview.1
  cancel-in-progress: false

permissions: {}

jobs:
  publish-installer:
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}

    steps:
      - name: Validate successful Windows build provenance
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          Set-StrictMode -Version Latest
          if ($env:BUILD_RUN_ID -notmatch '^[1-9][0-9]*$') {
            throw 'build_run_id must be a positive decimal run ID.'
          }
          if ($env:EXPECTED_SHA -notmatch '^[0-9a-fA-F]{40}$') {
            throw 'expected_sha must contain exactly 40 hexadecimal characters.'
          }
          $ExpectedSha = $env:EXPECTED_SHA.ToLowerInvariant()
          $RunJson = & gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:BUILD_RUN_ID"
          if ($LASTEXITCODE -ne 0) { throw 'Unable to read the requested build run.' }
          $Run = ($RunJson -join "`n") | ConvertFrom-Json
          if ([string]$Run.id -cne $env:BUILD_RUN_ID) { throw 'The returned build run ID does not match.' }
          if ($Run.repository.full_name -ine $env:GITHUB_REPOSITORY -or
              $Run.head_repository.full_name -ine $env:GITHUB_REPOSITORY) {
            throw 'The build must use source from this repository.'
          }
          if ($Run.status -cne 'completed' -or $Run.conclusion -cne 'success') {
            throw 'The referenced Windows build has not completed successfully.'
          }
          if (([string]$Run.head_sha).ToLowerInvariant() -cne $ExpectedSha) {
            throw 'The successful build did not test expected_sha.'
          }
          if ($Run.head_branch -cne 'main') { throw 'The build must come from main.' }
          $WorkflowPath = ([string]$Run.path -split '@', 2)[0]
          if ($WorkflowPath -cne '.github/workflows/windows-build.yml') {
            throw 'The run did not use the Windows installer build workflow.'
          }
          $BuildRunUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:BUILD_RUN_ID"
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Value "VALIDATED_BUILD_SHA=$ExpectedSha"
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Value "VALIDATED_BUILD_RUN_URL=$BuildRunUrl"

      - name: Download installer from the validated build
        uses: actions/download-artifact@v4
        with:
          name: NhacViecAnhHa-Windows-x64-2.0.4
          path: installer
          run-id: ${{ inputs.build_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Verify installer, checksum, and packaged self-test reports
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $InstallerDirectory = Join-Path $env:GITHUB_WORKSPACE 'installer'
          $InstallerName = 'NhacViecAnhHa-Setup-2.0.4-x64.exe'
          $InstallerPath = Join-Path $InstallerDirectory $InstallerName
          if (-not (Test-Path -LiteralPath $InstallerPath -PathType Leaf)) {
            throw 'The installer executable is missing.'
          }
          if ((Get-Item -LiteralPath $InstallerPath).Length -le 0) {
            throw 'The installer executable is empty.'
          }
          $Stream = [System.IO.File]::OpenRead($InstallerPath)
          try {
            if ($Stream.ReadByte() -ne 0x4D -or $Stream.ReadByte() -ne 0x5A) {
              throw 'The installer does not have a Windows executable MZ header.'
            }
          } finally {
            $Stream.Dispose()
          }
          $ChecksumPath = Join-Path $InstallerDirectory 'SHA256SUMS.txt'
          $ChecksumText = Get-Content -LiteralPath $ChecksumPath -Raw
          $ChecksumPattern = '\A(?<hash>[0-9a-fA-F]{64})  NhacViecAnhHa-Setup-2\.0\.4-x64\.exe(?:\r?\n)?\z'
          if ($ChecksumText -cnotmatch $ChecksumPattern) {
            throw 'SHA256SUMS.txt must contain exactly the expected installer entry.'
          }
          $ExpectedHash = $Matches['hash'].ToLowerInvariant()
          $ActualHash = (Get-FileHash -LiteralPath $InstallerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($ActualHash -cne $ExpectedHash) { throw 'The installer SHA256 does not match SHA256SUMS.txt.' }
          foreach ($Check in @(
            @{ File = 'self-test.json'; Gui = $false },
            @{ File = 'gui-smoke-test.json'; Gui = $true }
          )) {
            $ReportPath = Join-Path $InstallerDirectory $Check.File
            $Report = Get-Content -LiteralPath $ReportPath -Raw | ConvertFrom-Json
            if ($null -eq $Report -or $Report.passed -isnot [bool] -or $Report.passed -ne $true -or
                $Report.gui -isnot [bool] -or $Report.gui -ne $Check.Gui -or $Report.version -cne '2.0.4') {
              throw "Invalid packaged self-test result: $($Check.File)."
            }
            if ($Report.checks -isnot [System.Array] -or @($Report.checks).Count -eq 0) {
              throw "No packaged checks were recorded in $($Check.File)."
            }
            foreach ($RecordedCheck in $Report.checks) {
              if ($RecordedCheck -isnot [string] -or [string]::IsNullOrWhiteSpace($RecordedCheck)) {
                throw "An invalid packaged check was recorded in $($Check.File)."
              }
            }
          }
          $UpgradePath = Join-Path $InstallerDirectory 'installer-upgrade-test.json'
          $Upgrade = Get-Content -LiteralPath $UpgradePath -Raw | ConvertFrom-Json
          if ($null -eq $Upgrade -or $Upgrade.passed -isnot [bool] -or $Upgrade.passed -ne $true -or
              $Upgrade.version -cne '2.0.4' -or $Upgrade.baseline_version -cne '2.0.3' -or
              $Upgrade.checks -isnot [System.Array] -or @($Upgrade.checks).Count -eq 0 -or
              $Upgrade.cases -isnot [System.Array] -or @($Upgrade.cases).Count -eq 0) {
            throw 'The installer upgrade regression report is invalid or incomplete.'
          }
          foreach ($UpgradeCheck in $Upgrade.checks) {
            if ($UpgradeCheck -isnot [string] -or [string]::IsNullOrWhiteSpace($UpgradeCheck)) {
              throw 'An invalid check was recorded in the installer upgrade report.'
            }
          }
          foreach ($RequiredCase in @(
            'running_legacy_app_blocks_upgrade',
            'blocked_upgrade_preserves_files_and_data',
            'running_app_blocks_uninstall',
            'locked_sqlite_blocks_upgrade',
            'upgrade_after_exit_succeeds',
            'installed_runtime_passes',
            'user_data_preserved'
          )) {
            $Case = @($Upgrade.cases | Where-Object { $_.name -ceq $RequiredCase })
            if ($RequiredCase -cnotin $Upgrade.checks -or $Case.Count -ne 1 -or
                $Case[0].passed -isnot [bool] -or $Case[0].passed -ne $true) {
              throw "The installer upgrade regression did not pass: $RequiredCase."
            }
          }
          $LayoutDirectory = Join-Path $InstallerDirectory 'ui-preview'
          $LayoutReport = Get-Content (Join-Path $LayoutDirectory 'layout-check.json') -Raw | ConvertFrom-Json
          if ($LayoutReport.passed -isnot [bool] -or $LayoutReport.passed -ne $true -or
              $LayoutReport.version -cne '2.0.4' -or $LayoutReport.platform -cne 'win32' -or
              @($LayoutReport.checks).Count -lt 48 -or @($LayoutReport.screenshots).Count -lt 48 -or
              $LayoutReport.frozen -isnot [bool] -or $LayoutReport.frozen -ne $true -or
              $LayoutReport.executable -cne 'NhacViecAnhHa.exe' -or
              $LayoutReport.display_state.awareness -cne 'per-monitor-v2' -or
              $LayoutReport.display_state.window_awareness -cne 'per-monitor-v2') {
            throw 'Windows desktop layout checks did not pass.'
          }
          foreach ($ExpectedDpi in @(120, 144, 192)) {
            $Phase = @($LayoutReport.scaling | Where-Object { $_.phase -ceq "tk${ExpectedDpi}dpi" })
            if ($Phase.Count -ne 1 -or $Phase[0].mode -cne 'tk-font-layout-simulation' -or
                [math]::Abs([double]$Phase[0].effective_font_dpi - $ExpectedDpi) -gt 1.5 -or
                [math]::Abs([double]$Phase[0].viewport_scale - $ExpectedDpi / 96.0) -gt 0.02) {
              throw "The frozen application did not verify the ${ExpectedDpi}-DPI font/layout phase."
            }
          }
          foreach ($Preview in @('tasks-1366x768.png', 'calendar-month-1366x768.png', 'calendar-tasks-1366x768.png', 'task-dialog.png', 'notes-dialog.png',
                                  'tasks-1366x768-tk120dpi.png', 'tasks-1366x768-tk144dpi.png', 'tasks-1366x768-tk192dpi.png')) {
            $Bytes = [System.IO.File]::ReadAllBytes((Join-Path $LayoutDirectory $Preview))
            if ($Bytes.Length -lt 100 -or [System.BitConverter]::ToString($Bytes, 0, 8) -cne '89-50-4E-47-0D-0A-1A-0A') {
              throw "Invalid desktop preview image: $Preview"
            }
          }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Value "Verified installer SHA256: $ActualHash"

      - name: Publish the verified Windows preview release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          Set-StrictMode -Version Latest
          $Repository = $env:GITHUB_REPOSITORY
          $Tag = 'windows-2.0.4-preview.1'
          $ExpectedSha = $env:VALIDATED_BUILD_SHA
          function Assert-GitHubResourceMissing {
            param([string]$Endpoint, [string]$Description)
            $LookupOutput = & gh api --include $Endpoint 2>&1
            $LookupExitCode = $LASTEXITCODE
            if ($LookupExitCode -eq 0) { throw "$Description already exists; refusing to overwrite it." }
            $LookupText = ($LookupOutput | ForEach-Object { $_.ToString() }) -join "`n"
            if ($LookupExitCode -ne 1 -or $LookupText -notmatch '(?m)^HTTP/\S+\s+404(?:\s|$)') {
              throw "Unable to verify that $Description is absent (gh exit $LookupExitCode)."
            }
          }
          Assert-GitHubResourceMissing "repos/$Repository/releases/tags/$Tag" "Release $Tag"
          Assert-GitHubResourceMissing "repos/$Repository/git/ref/tags/$Tag" "Tag $Tag"
          $Notes = @'
          Bộ cài Nhắc việc anh Hà 2.0.4 dành cho Windows 10/11 x64, phát hành thử nghiệm.

          Sửa lỗi cài đè báo không mở được `_internal\_sqlite3.pyd` để ghi. Trước khi chép hoặc gỡ tệp, bộ cài kiểm tra tệp ứng dụng đang bị giữ và quyền ghi thư mục đích. Nếu ứng dụng cũ còn chạy, anh có thể lưu nội dung, chọn Thoát hẳn rồi Thử lại; bộ cài không tự kết thúc tiến trình. Chế độ cài im lặng dừng với mã lỗi trước khi thay tệp.

          Các kiểm tra nâng cấp đã dùng chính bản 2.0.3 đang chạy và tình huống tệp SQLite bị khóa. Lần nâng cấp bị chặn giữ nguyên tệp ứng dụng và dữ liệu; sau khi đóng ứng dụng hoặc nhả khóa, cài đè thành công. Gỡ cài đặt cũng được chặn khi ứng dụng đang chạy. Báo cáo `installer-upgrade-test.json` được đính kèm.

          Giữ các chức năng lịch theo deadline, thẻ công việc và Ghi chú từ 2.0.3. Bản 2.0.4 dùng cùng schema 2; dữ liệu 2.0.3 không cần chuyển đổi thêm.

          Bản dựng tham chiếu đã chạy thành công toàn bộ kiểm thử mã nguồn trên Windows, kiểm tra EXE bằng `--self-test` và `--gui-smoke-test`, cùng kiểm tra cài đặt và gỡ cài đặt tự động. Hai báo cáo kiểm tra EXE và mã SHA256 được đính kèm.

          Mã nguồn đã kiểm thử: `__SOURCE_SHA__`.
          Lần dựng Windows: __BUILD_RUN_URL__

          Đã kiểm tra chính EXE đã đóng gói: nhận thức DPI PerMonitorV2, bố cục ở hai kích thước cửa sổ logic 1120×720 và 1366×768, cùng cỡ chữ/bố cục Tk tương đương 125%, 150% và 200%. Các mức sau là mô phỏng cỡ chữ/bố cục của ứng dụng, không thay đổi thiết lập DPI của Windows. Ảnh chụp từ ứng dụng thật bằng dữ liệu minh họa tạm thời; ảnh ở từng mức được đính kèm.

          ![Danh sách công việc](https://github.com/__REPOSITORY__/releases/download/windows-2.0.4-preview.1/tasks-1366x768.png)
          ![Công việc theo ngày deadline](https://github.com/__REPOSITORY__/releases/download/windows-2.0.4-preview.1/calendar-tasks-1366x768.png)
          ![Ghi chú công việc](https://github.com/__REPOSITORY__/releases/download/windows-2.0.4-preview.1/notes-dialog.png)

          Cài đặt:
          1. Tải `NhacViecAnhHa-Setup-2.0.4-x64.exe` và `SHA256SUMS.txt` từ phần Assets.
          2. Đối chiếu SHA256, sau đó mở bộ cài và làm theo hướng dẫn. Ứng dụng được cài cho tài khoản Windows hiện tại.
          3. Mở Nhắc việc anh Hà từ menu Start hoặc trang cuối của bộ cài.

          Chọn Thoát hẳn ứng dụng trước khi chạy bộ cài mới; không cần gỡ bản cũ. Nếu đang dùng 2.0.3, công việc, lịch, ghi chú và cài đặt tiếp tục dùng được ngay. Nếu nâng từ 2.0.0–2.0.2, lần mở đầu kiểm tra dữ liệu, giữ bản sao trước nâng cấp và bổ sung trường Ghi chú. Bản sao lưu 2.0.0–2.0.2 vẫn có thể khôi phục; dữ liệu đã nâng cấp cần ứng dụng hỗ trợ schema 2, gồm 2.0.3 hoặc mới hơn.

          Dữ liệu của bản mới nằm tại `~\NhacViecAnhHaMoi\data\tasks.db`, tách riêng dữ liệu bản cũ. Bản này chưa hỗ trợ tự động nhập cơ sở dữ liệu của bản 1.7.0; gỡ cài đặt giữ lại dữ liệu người dùng.

          Bộ cài chưa ký số, vì vậy Windows có thể hiển thị cảnh báo SmartScreen. Thông báo Windows và khay hệ thống cần được kiểm tra thêm trên máy sử dụng thực tế.
          '@
          $Notes = $Notes.Replace('__SOURCE_SHA__', $ExpectedSha).Replace('__BUILD_RUN_URL__', $env:VALIDATED_BUILD_RUN_URL).Replace('__REPOSITORY__', $Repository)
          $NotesPath = Join-Path $env:RUNNER_TEMP ('NhacViecAnhHa-release-notes-' + $env:GITHUB_RUN_ID + '.md')
          Set-Content -LiteralPath $NotesPath -Value $Notes -Encoding utf8
          $InstallerDirectory = Join-Path $env:GITHUB_WORKSPACE 'installer'
          $Assets = @(
            (Join-Path $InstallerDirectory 'NhacViecAnhHa-Setup-2.0.4-x64.exe'),
            (Join-Path $InstallerDirectory 'SHA256SUMS.txt'),
            (Join-Path $InstallerDirectory 'self-test.json'),
            (Join-Path $InstallerDirectory 'gui-smoke-test.json'),
            (Join-Path $InstallerDirectory 'installer-upgrade-test.json'),
            (Join-Path $InstallerDirectory 'ui-preview/layout-check.json'),
            (Join-Path $InstallerDirectory 'ui-preview/tasks-1366x768.png'),
            (Join-Path $InstallerDirectory 'ui-preview/calendar-month-1366x768.png'),
            (Join-Path $InstallerDirectory 'ui-preview/calendar-tasks-1366x768.png'),
            (Join-Path $InstallerDirectory 'ui-preview/task-dialog.png'),
            (Join-Path $InstallerDirectory 'ui-preview/notes-dialog.png'),
            (Join-Path $InstallerDirectory 'ui-preview/tasks-1366x768-tk120dpi.png'),
            (Join-Path $InstallerDirectory 'ui-preview/tasks-1366x768-tk144dpi.png'),
            (Join-Path $InstallerDirectory 'ui-preview/tasks-1366x768-tk192dpi.png')
          )
          & gh release create $Tag @Assets --repo $Repository --target $ExpectedSha --prerelease --title 'Nhắc việc anh Hà 2.0.4 thử nghiệm — Windows x64' --notes-file $NotesPath
          if ($LASTEXITCODE -ne 0) { throw 'GitHub did not publish the Windows preview release successfully.' }
          $ReleaseUrl = & gh release view $Tag --repo $Repository --json url --jq '.url'
          if ($LASTEXITCODE -ne 0) { throw 'The release was published, but its URL could not be read.' }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Value "Published Windows installer: $ReleaseUrl"
