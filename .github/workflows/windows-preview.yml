name: Refresh Windows interface previews

on:
  workflow_dispatch:
    inputs:
      tested_sha:
        description: Full source commit SHA tested by the released Windows build
        required: true
        type: string

permissions: {}

jobs:
  desktop-previews:
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TESTED_SHA: ${{ inputs.tested_sha }}
      RELEASE_TAG: windows-2.0.2-preview.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify the previews match the released application
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:TESTED_SHA -notmatch '^[0-9a-fA-F]{40}$') {
            throw 'tested_sha must contain exactly 40 hexadecimal characters.'
          }
          $env:TESTED_SHA = $env:TESTED_SHA.ToLowerInvariant()
          & git diff --quiet $env:TESTED_SHA HEAD -- nhacviec requirements.txt packaging
          if ($LASTEXITCODE -ne 0) { throw 'Application code differs from the tested release.' }
          $releaseJson = & gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Unable to verify the existing release.' }
          $release = ($releaseJson -join "`n") | ConvertFrom-Json
          if ($release.target_commitish -cne $env:TESTED_SHA -or $release.draft -ne $false) {
            throw 'The preview target does not match the tested release.'
          }
      - name: Download and install the verified released application
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $download = Join-Path $env:RUNNER_TEMP 'NhacViecReleasedSetup'
          New-Item -ItemType Directory -Path $download -Force | Out-Null
          & gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir $download --pattern 'NhacViecAnhHa-Setup-2.0.2-x64.exe' --pattern 'SHA256SUMS.txt'
          if ($LASTEXITCODE -ne 0) { throw 'Unable to download the released application.' }
          $checksum = Get-Content (Join-Path $download 'SHA256SUMS.txt') -Raw
          if ($checksum -cnotmatch '\A(?<hash>[0-9a-fA-F]{64})  NhacViecAnhHa-Setup-2\.0\.2-x64\.exe(?:\r?\n)?\z') {
            throw 'Invalid released installer checksum entry.'
          }
          $expected = $Matches['hash']
          $setup = Join-Path $download 'NhacViecAnhHa-Setup-2.0.2-x64.exe'
          if ((Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash -ine $expected) {
            throw 'The released installer checksum does not match.'
          }
          $install = Join-Path $env:RUNNER_TEMP 'NhacViecReleasedPreview'
          $process = Start-Process -FilePath $setup -ArgumentList "/S /D=$install" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Unable to install the released application.' }
          "PREVIEW_INSTALL_DIR=$install" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
      - name: Prepare the ephemeral Windows capture display
        shell: pwsh
        run: |
          & .\scripts\prepare_capture_display.ps1
      - name: Capture and verify the complete Windows interface
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:PREVIEW_INSTALL_DIR 'NhacViecAnhHa.exe'
          $output = Join-Path $PWD 'build\ui-preview'
          $process = Start-Process -FilePath $exe -ArgumentList @('--capture-ui', ('"' + $output + '"')) -PassThru
          if (-not $process.WaitForExit(180000)) {
            $process.Kill()
            throw 'Released application capture exceeded three minutes.'
          }
          $process.Refresh()
          $reportPath = Join-Path $output 'layout-check.json'
          if (-not (Test-Path -LiteralPath $reportPath)) { throw 'Released application did not write a layout report.' }
          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          if ($process.ExitCode -ne 0 -or $report.passed -ne $true) {
            $message = ([string]$report.error).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Windows preview capture::$message"
            throw 'Complete Windows interface capture failed.'
          }
      - name: Update only the verified images and layout report
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $report = Get-Content .\build\ui-preview\layout-check.json -Raw | ConvertFrom-Json
          if ($report.passed -ne $true -or $report.platform -cne 'win32' -or $report.version -cne '2.0.2' -or @($report.checks).Count -lt 48 -or
              $report.frozen -isnot [bool] -or $report.frozen -ne $true -or
              $report.executable -cne 'NhacViecAnhHa.exe' -or
              $report.display_state.awareness -cne 'per-monitor-v2' -or
              $report.display_state.window_awareness -cne 'per-monitor-v2') {
            throw 'Preview layout checks did not pass.'
          }
          & gh release upload $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --clobber `
            .\build\ui-preview\tasks-1366x768.png `
            .\build\ui-preview\calendar-month-1366x768.png `
            .\build\ui-preview\task-dialog.png `
            .\build\ui-preview\tasks-1366x768-tk120dpi.png `
            .\build\ui-preview\tasks-1366x768-tk144dpi.png `
            .\build\ui-preview\tasks-1366x768-tk192dpi.png `
            .\build\ui-preview\layout-check.json
          if ($LASTEXITCODE -ne 0) { throw 'Preview asset update failed.' }
      - name: Remove the temporary preview installation
        if: always()
        shell: pwsh
        run: |
          if ($env:PREVIEW_INSTALL_DIR) {
            $uninstaller = Join-Path $env:PREVIEW_INSTALL_DIR 'Uninstall.exe'
            if (Test-Path -LiteralPath $uninstaller) {
              $process = Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
              if ($process.ExitCode -ne 0) { throw 'Temporary preview uninstallation failed.' }
            }
          }
